name: release

# 推送 v* 标签时：云端构建全平台安装包并发布到 GitHub Releases
# workflow_dispatch：允许从 Actions 页面/API 手动触发（网络受限环境的兜底）
# 桌面三平台只构建上传产物（--publish never），由 release job 统一创建
# Release —— 并行 electron-builder 发布同一 Release 会 422 冲突
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 释放磁盘：删无关大件（dotnet/ghc/模拟器镜像），保留 Android SDK 本体
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/lib/android/sdk/system-images || true
          sudo apt-get clean || true
          df -h /
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: bun install
      - name: Generate native project
        run: bunx expo prebuild -p android --no-install
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtd-android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

  desktop-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Export web bundle
        run: bun run export:web
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Build electron main
        run: bun run build
        working-directory: apps/desktop
      - name: Build installer (no publish)
        run: bunx electron-builder --win --publish never
        working-directory: apps/desktop
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtd-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap

  desktop-linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Export web bundle
        run: bun run export:web
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Build electron main
        run: bun run build
        working-directory: apps/desktop
      - name: Build AppImage (no publish)
        run: bunx electron-builder --linux --publish never
        working-directory: apps/desktop
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtd-linux
          path: apps/desktop/release/*.AppImage

  desktop-macos:
    name: macOS dmg (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Export web bundle
        run: bun run export:web
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Build electron main
        run: bun run build
        working-directory: apps/desktop
      - name: Build dmg (no publish)
        run: bunx electron-builder --mac --publish never
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtd-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.blockmap

  release:
    name: Create release with all artifacts
    runs-on: ubuntu-latest
    needs: [android-apk, desktop-windows, desktop-linux, desktop-macos]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release with all installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          FILES=$(find artifacts -type f | sed 's/^/"/;s/$/"/' | tr '\n' ' ')
          gh release create "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "GTD 清单 ${GITHUB_REF_NAME}" \
            --notes "安装包由 CI 构建。APK 为 debug 签名可直接安装；macOS dmg 未签名（首次打开需右键 → 打开）。" \
            $FILES
