name: release

# 推送 v* 标签时：云端构建全平台安装包并发布到 GitHub Releases
# workflow_dispatch：允许从 Actions 页面/API 手动触发（网络受限环境的兜底）
# 桌面三平台只构建上传产物（--publish never），由 release job 统一创建
# Release —— 并行 electron-builder 发布同一 Release 会 422 冲突
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  android-apk:
    name: Android APK (release, signed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # 释放磁盘：删无关大件（dotnet/ghc/模拟器镜像），保留 Android SDK 本体
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/lib/android/sdk/system-images || true
          sudo apt-get clean || true
          df -h /
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: bun install
      - name: Generate native project
        run: bunx expo prebuild -p android --no-install
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Inject release signing config
        run: |
          cat >> apps/mobile/android/app/build.gradle <<'EOF'
          android {
            signingConfigs {
              release {
                storeFile file("../../keys/gtd-release.p12")
                storePassword System.getenv("GTD_KEYSTORE_PASSWORD")
                keyAlias "gtd"
                keyPassword System.getenv("GTD_KEYSTORE_PASSWORD")
                storeType "PKCS12"
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF
          echo "signing injected"
        env:
          GTD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android
        env:
          GTD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_reactNativeArchitectures: "arm64-v8a,armeabi-v7a,x86_64"
      - name: Verify APK (signature + manifest)
        run: |
          set -e
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          BT="$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK" | head -4
          "$BT/aapt" dump badging "$APK" | grep -E "^package|^application-label:|launchable-activity" | head -4
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gtd-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk

  desktop-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Export web bundle
        run: bun run export:web
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Build electron main
        run: bun run build
        working-directory: apps/desktop
      - name: Build installer (no publish)
        run: bunx electron-builder --win --publish never
        working-directory: apps/desktop
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gtd-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap

  desktop-linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Export web bundle
        run: bun run export:web
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Build electron main
        run: bun run build
        working-directory: apps/desktop
      - name: Build AppImage (no publish)
        run: bunx electron-builder --linux --publish never
        working-directory: apps/desktop
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gtd-linux
          path: apps/desktop/release/*.AppImage

  desktop-macos:
    name: macOS dmg (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Export web bundle
        run: bun run export:web
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Build electron main
        run: bun run build
        working-directory: apps/desktop
      - name: Build dmg (no publish)
        run: bunx electron-builder --mac --publish never
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gtd-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.blockmap

  release:
    name: Create release with all artifacts
    runs-on: ubuntu-latest
    needs: [android-apk, desktop-windows, desktop-linux, desktop-macos]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
      - name: Rename for clarity
        run: |
          mv artifacts/gtd-android-apk/app-release.apk "artifacts/gtd-android-apk/GTD-${GITHUB_REF_NAME}-android.apk" || true
      - name: Create release with all installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          shopt -s globstar nullglob
          FILES=()
          for f in artifacts/**/*; do
            if [ -f "$f" ]; then FILES+=("$f"); fi
          done
          gh release create "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "GTD 清单 ${GITHUB_REF_NAME}" \
            --notes "安装包由 CI 构建。Android 为签名 release 包（如曾装过旧 debug 版请先卸载）；macOS dmg 未签名（首次打开需右键 → 打开）。" \
            "${FILES[@]}"
