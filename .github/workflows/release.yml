name: release

# 推送 v* 标签时：云端构建全平台安装包并发布到 GitHub Releases
# workflow_dispatch：允许从 Actions 页面/API 手动触发（网络受限环境的兜底）
# 桌面三平台只构建上传产物（--publish never），由 release job 统一创建
# Release —— 并行 electron-builder 发布同一 Release 会 422 冲突
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  android-apk:
    name: Android APK (release, signed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # 释放磁盘：删无关大件（dotnet/ghc/模拟器镜像），保留 Android SDK 本体
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/lib/android/sdk/system-images || true
          sudo apt-get clean || true
          df -h /
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: bun install
      - name: Generate native project
        run: bunx expo prebuild -p android --no-install
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Inject native fontScale lock (OriginOS/MIUI 大字体根治)
        run: |
          python3 - <<'PYEOF'
          p = "apps/mobile/android/app/src/main/java/app/gtd/local/MainActivity.kt"
          s = open(p, encoding="utf-8").read()
          if "attachBaseContext" not in s:
              marker = "class MainActivity : ReactActivity() {"
              assert marker in s, "MainActivity marker not found"
              inject = marker + """
                  override fun attachBaseContext(newBase: android.content.Context) {
                      val config = android.content.res.Configuration(newBase.resources.configuration)
                      config.fontScale = 1.0f
                      super.attachBaseContext(newBase.createConfigurationContext(config))
                  }
          """
              s = s.replace(marker, inject, 1)
              open(p, "w", encoding="utf-8").write(s)
              print("fontScale=1 injected into MainActivity")
          else:
              print("already injected")
          PYEOF
      - name: Inject release signing config
        run: |
          cat >> apps/mobile/android/app/build.gradle <<'EOF'
          android {
            signingConfigs {
              release {
                storeFile file("../../keys/gtd-release.p12")
                storePassword System.getenv("GTD_KEYSTORE_PASSWORD")
                keyAlias "gtd"
                keyPassword System.getenv("GTD_KEYSTORE_PASSWORD")
                storeType "PKCS12"
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF
          echo "signing injected"
        env:
          GTD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android
        env:
          GTD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_reactNativeArchitectures: "arm64-v8a,armeabi-v7a,x86_64"
      - name: Verify APK (signature + manifest)
        run: |
          set -e
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          BT="$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK" | head -4
          "$BT/aapt" dump badging "$APK" | grep -E "^package|^application-label:|launchable-activity" | head -4
      # 直接挂到 Release（不经制品存储：Actions 制品配额有限）
      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          cp "$APK" "GTD-${GITHUB_REF_NAME}-android.apk"
          gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" \
              --title "GTD 清单 ${GITHUB_REF_NAME}" \
              --notes "CI 构建。Android 为签名 release 包；macOS dmg 未签名（首次打开需右键 → 打开）。"
          gh release upload "${GITHUB_REF_NAME}" "GTD-${GITHUB_REF_NAME}-android.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber

  desktop-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Export web bundle
        run: bun run export:web
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Build electron main
        run: bun run build
        working-directory: apps/desktop
      # 直接发布到 Release（不经 Actions 制品存储，规避配额限制）
      - name: Build and publish installer
        run: bunx electron-builder --win --publish always
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

  desktop-linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Export web bundle
        run: bun run export:web
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Build electron main
        run: bun run build
        working-directory: apps/desktop
      - name: Build AppImage and publish
        run: bunx electron-builder --linux --publish always
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-macos:
    name: macOS dmg (unsigned)
    runs-on: macos-latest
    # 串行化：并发创建同一 Release 会 422
    needs: [desktop-windows, desktop-linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Export web bundle
        run: bun run export:web
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Build electron main
        run: bun run build
        working-directory: apps/desktop
      # 用 --publish never 构建，再手工 gh release upload：
      # electron-builder 的 publish 会清理同名资产，与其它平台并发时返回 422
      - name: Build dmg
        run: bunx electron-builder --mac --publish never
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload dmg to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -la apps/desktop/release/*.dmg
          gh release upload "${GITHUB_REF_NAME}" apps/desktop/release/*.dmg \
            --repo "$GITHUB_REPOSITORY" --clobber
