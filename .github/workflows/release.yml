name: release

# 推送 v* 标签时：云端构建全平台安装包并发布到 GitHub Releases
# workflow_dispatch：允许从 Actions 页面/API 手动触发（网络受限环境的兜底）
# 桌面三平台只构建上传产物（--publish never），由 release job 统一创建
# Release —— 并行 electron-builder 发布同一 Release 会 422 冲突
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  android-apk:
    name: Android APK (release, signed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # 释放磁盘：删无关大件（dotnet/ghc/模拟器镜像），保留 Android SDK 本体
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/lib/android/sdk/system-images || true
          sudo apt-get clean || true
          df -h /
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: bun install
      - name: Generate native project
        run: bunx expo prebuild -p android --no-install
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Inject native fontScale lock (OriginOS/MIUI 大字体根治)
        run: |
          python3 - <<'PYEOF'
          p = "apps/mobile/android/app/src/main/java/app/gtd/local/MainActivity.kt"
          s = open(p, encoding="utf-8").read()
          if "attachBaseContext" not in s:
              marker = "class MainActivity : ReactActivity() {"
              assert marker in s, "MainActivity marker not found"
              inject = marker + """
                  override fun attachBaseContext(newBase: android.content.Context) {
                      val config = android.content.res.Configuration(newBase.resources.configuration)
                      config.fontScale = 1.0f
                      super.attachBaseContext(newBase.createConfigurationContext(config))
                  }
          """
              s = s.replace(marker, inject, 1)
              open(p, "w", encoding="utf-8").write(s)
              print("fontScale=1 injected into MainActivity")
          else:
              print("already injected")
          PYEOF
      - name: Restore signing keystore from Secrets
        run: |
          set -e
          mkdir -p apps/mobile/keys
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/mobile/keys/gtd-release.p12
          test -s apps/mobile/keys/gtd-release.p12
          echo "keystore restored ($(wc -c < apps/mobile/keys/gtd-release.p12) bytes)"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Inject release signing config
        run: |
          cat >> apps/mobile/android/app/build.gradle <<'EOF'
          android {
            signingConfigs {
              release {
                storeFile file("../../keys/gtd-release.p12")
                storePassword System.getenv("GTD_KEYSTORE_PASSWORD")
                keyAlias "gtd"
                keyPassword System.getenv("GTD_KEYSTORE_PASSWORD")
                storeType "PKCS12"
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF
          echo "signing injected"
        env:
          GTD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Inject ABI splits + APK naming (arm64/v7a/x86_64 + universal)
        run: |
          cat >> apps/mobile/android/app/build.gradle <<'EOF'
          android {
            splits {
              abi {
                enable true
                reset()
                include "armeabi-v7a", "arm64-v8a", "x86_64"
                universalApk true
              }
            }
            applicationVariants.all { variant ->
              variant.outputs.all { output ->
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = abi != null ?
                    "GTD-v${variant.versionName}-${abi}.apk" :
                    "GTD-v${variant.versionName}-universal.apk"
              }
            }
          }
          EOF
          echo "abi splits injected"
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android
        env:
          GTD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_reactNativeArchitectures: "arm64-v8a,armeabi-v7a,x86_64"
      - name: Verify APKs (signature + manifest + version)
        run: |
          set -e
          OUT="apps/mobile/android/app/build/outputs/apk/release"
          COUNT=$(ls "$OUT"/GTD-*.apk | wc -l)
          echo "produced $COUNT APKs"
          test "$COUNT" -ge 4
          EXPECTED=$(python3 -c "import json;print(json.load(open('apps/mobile/app.json'))['expo']['version'])")
          echo "expected versionName=$EXPECTED"
          BT="$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)"
          for APK in "$OUT"/GTD-*.apk; do
            echo "== $(basename "$APK") =="
            "$BT/apksigner" verify --print-certs "$APK" | head -4
            "$BT/aapt" dump badging "$APK" | grep -E "^package|^application-label:|launchable-activity" | head -4
            "$BT/aapt" dump badging "$APK" | grep -q "versionName='$EXPECTED'" || {
              echo "FATAL: versionName mismatch in $APK (expected $EXPECTED)"; exit 1;
            }
          done
      # 直接挂到 Release（不经制品存储：Actions 制品配额有限）
      - name: Upload APKs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # tag 触发时 GITHUB_REF_NAME=tag；workflow_dispatch 时为 main → 从 app.json 推导
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v$(python3 -c "import json;print(json.load(open('apps/mobile/app.json'))['expo']['version'])")" ;; esac
          echo "release tag=$TAG"
          OUT="apps/mobile/android/app/build/outputs/apk/release"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "GTD 清单 $TAG" \
              --notes "CI 构建。Android 为签名 release 包（arm64/v7a/x86_64 分包 + universal 通用包）；macOS dmg 未签名（首次打开需右键 → 打开）；iOS 为未签名 IPA（TrollStore/自签侧载，见 README）。"
          gh release upload "$TAG" "$OUT"/GTD-*.apk \
            --repo "$GITHUB_REPOSITORY" --clobber

  ios-unsigned:
    name: iOS (unsigned IPA + simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Generate native project
        run: bunx expo prebuild -p ios --no-install
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
      - name: Install pods
        run: pod install --project-directory=ios
        working-directory: apps/mobile
      # 发现 prebuild 生成的 workspace/scheme/app 名（随 app.json name 变化）。
      # 注意：`ls 目录通配符` 会列出目录内容而非目录本身，必须用 find
      - name: Resolve build names
        id: names
        run: |
          set -e
          set -o pipefail
          WS_PATH=$(find apps/mobile/ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          if [ -z "$WS_PATH" ]; then
            echo "FATAL: no .xcworkspace generated"; ls -la apps/mobile/ios; exit 1
          fi
          WS=$(basename "$WS_PATH" .xcworkspace)
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "path=$WS_PATH" >> "$GITHUB_OUTPUT"
          echo "resolved: $WS_PATH"
      - name: Build device (unsigned, arm64)
        run: |
          set -e
          WS_PATH="${{ steps.names.outputs.path }}"
          xcodebuild -workspace "$WS_PATH" -scheme "${{ steps.names.outputs.workspace }}" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath apps/mobile/build/ios | tail -5
      - name: Build simulator
        run: |
          set -e
          WS_PATH="${{ steps.names.outputs.path }}"
          xcodebuild -workspace "$WS_PATH" -scheme "${{ steps.names.outputs.workspace }}" \
            -configuration Release -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath apps/mobile/build/ios-sim | tail -5
      - name: Package IPA + simulator zip
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v$(python3 -c "import json;print(json.load(open('apps/mobile/app.json'))['expo']['version'])")" ;; esac
          echo "release tag=$TAG"
          APP=$(find apps/mobile/build/ios/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "FATAL: no .app produced"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "GTD-$TAG-ios-unsigned.ipa" Payload
          rm -rf Payload
          SIM=$(find apps/mobile/build/ios-sim/Build/Products/Release-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          test -n "$SIM" || { echo "FATAL: no simulator .app produced"; exit 1; }
          zip -qry "GTD-$TAG-ios-simulator.zip" "$SIM"
          ls -la GTD-$TAG-ios-*
      - name: Upload iOS artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v$(python3 -c "import json;print(json.load(open('apps/mobile/app.json'))['expo']['version'])")" ;; esac
          echo "release tag=$TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "GTD 清单 $TAG" \
              --notes "CI 构建。"
          gh release upload "$TAG" \
            "GTD-$TAG-ios-unsigned.ipa" "GTD-$TAG-ios-simulator.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber

  desktop-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Export web bundle
        run: bun run export:web
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Build electron main
        run: bun run build
        working-directory: apps/desktop
      # 直接发布到 Release（不经 Actions 制品存储，规避配额限制）
      - name: Build and publish installer
        run: bunx electron-builder --win --publish always
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

  desktop-linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Export web bundle
        run: bun run export:web
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Build electron main
        run: bun run build
        working-directory: apps/desktop
      - name: Build AppImage and publish
        run: bunx electron-builder --linux --publish always
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-macos:
    name: macOS dmg (unsigned)
    runs-on: macos-latest
    # 串行化：并发创建同一 Release 会 422
    needs: [desktop-windows, desktop-linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Export web bundle
        run: bun run export:web
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Build electron main
        run: bun run build
        working-directory: apps/desktop
      # 用 --publish never 构建，再手工 gh release upload：
      # electron-builder 的 publish 会清理同名资产，与其它平台并发时返回 422
      - name: Build dmg
        run: bunx electron-builder --mac --publish never
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload dmg to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v$(python3 -c "import json;print(json.load(open('apps/mobile/app.json'))['expo']['version'])")" ;; esac
          echo "release tag=$TAG"
          ls -la apps/desktop/release/*.dmg
          gh release upload "$TAG" apps/desktop/release/*.dmg \
            --repo "$GITHUB_REPOSITORY" --clobber
