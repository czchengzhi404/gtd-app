name: release

# 推送 v* 标签时：云端构建全平台安装包并发布到 GitHub Releases
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: bun install
      - name: Generate native project
        run: bunx expo prebuild -p android --no-install
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtd-android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

  desktop-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Export web bundle
        run: bun run export:web
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Build electron main
        run: bun run build
        working-directory: apps/desktop
      - name: Build and publish
        run: bunx electron-builder --win --publish always
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

  desktop-linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Export web bundle
        run: bun run export:web
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Build electron main
        run: bun run build
        working-directory: apps/desktop
      - name: Build and publish
        run: bunx electron-builder --linux --publish always
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-macos:
    name: macOS dmg (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Export web bundle
        run: bun run export:web
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Build electron main
        run: bun run build
        working-directory: apps/desktop
      - name: Build and publish (unsigned)
        run: bunx electron-builder --mac --publish always
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  release:
    name: Attach artifacts to release
    runs-on: ubuntu-latest
    needs: [android-apk, desktop-windows, desktop-linux, desktop-macos]
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "GTD 清单 ${GITHUB_REF_NAME}" \
            --notes "安装包由 CI 构建。APK 为 debug 签名可直接安装；macOS dmg 未签名（首次打开需右键 → 打开）。" \
            "artifacts/gtd-android-apk/app-debug.apk#GTD-清单-android.apk" \
            --clobber
