name: apk

# 仅构建 Android APK 并上传为 Actions artifact（不创建 Release、不发布）。
# 用途：本地无完整 C++ 构建环境时，借用 CI runner 产出可安装的签名 APK。
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  android-apk:
    name: Android APK (signed, arm64 + splits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/lib/android/sdk/system-images || true
          sudo apt-get clean || true
          df -h /
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: bun install
      - name: Generate native project
        run: bunx expo prebuild -p android --no-install
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Inject native fontScale lock (OriginOS/MIUI 大字体根洽)
        run: |
          python3 - <<'PYEOF'
          p = "apps/mobile/android/app/src/main/java/app/gtd/local/MainActivity.kt"
          s = open(p, encoding="utf-8").read()
          if "attachBaseContext" not in s:
              marker = "class MainActivity : ReactActivity() {"
              assert marker in s, "MainActivity marker not found"
              inject = marker + """
                  override fun attachBaseContext(newBase: android.content.Context) {
                      val config = android.content.res.Configuration(newBase.resources.configuration)
                      config.fontScale = 1.0f
                      super.attachBaseContext(newBase.createConfigurationContext(config))
                  }
          """
              s = s.replace(marker, inject, 1)
              open(p, "w", encoding="utf-8").write(s)
              print("fontScale=1 injected into MainActivity")
          else:
              print("already injected")
          PYEOF
      - name: Restore signing keystore from Secrets
        run: |
          set -e
          mkdir -p apps/mobile/keys
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/mobile/keys/gtd-release.p12
          test -s apps/mobile/keys/gtd-release.p12
          echo "keystore restored ($(wc -c < apps/mobile/keys/gtd-release.p12) bytes)"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Inject release signing config
        run: |
          cat >> apps/mobile/android/app/build.gradle <<'EOF'
          android {
            signingConfigs {
              release {
                storeFile file("../../keys/gtd-release.p12")
                storePassword System.getenv("GTD_KEYSTORE_PASSWORD")
                keyAlias "gtd"
                keyPassword System.getenv("GTD_KEYSTORE_PASSWORD")
                storeType "PKCS12"
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF
          echo "signing injected"
      - name: Inject ABI splits + APK naming
        run: |
          cat >> apps/mobile/android/app/build.gradle <<'EOF'
          android {
            splits {
              abi {
                enable true
                reset()
                include "armeabi-v7a", "arm64-v8a", "x86_64"
                universalApk true
              }
            }
            applicationVariants.all { variant ->
              variant.outputs.all { output ->
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = abi != null ?
                    "GTD-v${variant.versionName}-${abi}.apk" :
                    "GTD-v${variant.versionName}-universal.apk"
              }
            }
          }
          EOF
          echo "abi splits injected"
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android
        env:
          GTD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_reactNativeArchitectures: "arm64-v8a,armeabi-v7a,x86_64"
      - name: Verify APKs (signature + manifest + version)
        run: |
          set -e
          OUT="apps/mobile/android/app/build/outputs/apk/release"
          COUNT=$(ls "$OUT"/GTD-*.apk | wc -l)
          echo "produced $COUNT APKs"
          test "$COUNT" -ge 4
          EXPECTED=$(python3 -c "import json;print(json.load(open('apps/mobile/app.json'))['expo']['version'])")
          BT="$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)"
          for APK in "$OUT"/GTD-*.apk; do
            echo "== $(basename "$APK") =="
            "$BT/apksigner" verify --print-certs "$APK" | head -4
            "$BT/aapt" dump badging "$APK" | grep -E "^package|native-code" | head -3
            "$BT/aapt" dump badging "$APK" | grep -q "versionName='$EXPECTED'" || { echo "FATAL: versionName mismatch"; exit 1; }
          done
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: gtd-apks
          path: apps/mobile/android/app/build/outputs/apk/release/GTD-*.apk
          retention-days: 7
