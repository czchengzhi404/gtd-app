name: apk
on:
  workflow_dispatch: {}
permissions:
  actions: read
  contents: write
jobs:
  relay-existing-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Relay already signed and verified CI outputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download 44515987156 --repo czchengzhi404/gtd-app --name gtd-apks --dir apks
          gh release view dark-check-2.7.35 --repo czchengzhi404/gtd-app >/dev/null 2>&1 || gh release create dark-check-2.7.35 --repo czchengzhi404/gtd-app --target 324d0d017f75131c9973c8380ab0f1209f19027e --prerelease --title 'GTD 2.7.35 dark-mode verification candidate' --notes 'Signed candidate from CI run 44515987156. Runtime verification is in progress; this is not the stable release.'
          gh release upload dark-check-2.7.35 apks/GTD-v2.7.35-x86_64.apk apks/GTD-v2.7.35-arm64-v8a.apk --repo czchengzhi404/gtd-app --clobber
