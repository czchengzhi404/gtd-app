# electron-builder 打包配置（阶段四）。
# better-sqlite3 v13 为 N-API 预编译，无需 rebuild（Bun 也没有 rebuild 子命令）。
# 若未来需要源码编译：先跑 scripts/rebuild-native.mjs（@electron/rebuild）。
appId: app.gtd.local
productName: GTD 清单
copyright: Local-first GTD

directories:
  output: release
  buildResources: assets

files:
  - dist-electron/**/*
  - renderer/**/*
  - assets/**/*
  - package.json

# .node 原生模块从 asar 解包，保证运行时可加载
asarUnpack:
  - "**/*.node"

npmRebuild: false

# ---- 自动更新（electron-updater）：发布到 GitHub Releases 后自动可用 ----
# 私有仓库的更新下载需要访问令牌，未签名构建也会被 macOS 拦截；
# 仓库转公开后即开即用。
publish:
  provider: github
  owner: czchengzhi404
  repo: gtd-app

win:
  icon: assets/icon.png
  target:
    - target: nsis
      arch: [x64]
  # 代码签名（阶段四基础项）：设置环境变量 CSC_LINK / CSC_KEY_PASSWORD 启用；
  # 未配置时本地构建不签名（安装包仍可用，SmartScreen 会提示）。
  # certificateSubjectName: 你的证书主体

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: GTD 清单

mac:
  icon: assets/icon.png
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity
  # macOS 自动更新必须签名公证（Apple Development / Developer ID）：
  # identity: null            # 本地构建显式关闭签名
  # 设置 CSC_LINK/CSC_KEY_PASSWORD + notarize 配置后启用以下项
  # identity: Developer ID Application: 你的名字 (TEAMID)
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

linux:
  icon: assets/icon.png
  target:
    - AppImage
  category: Utility
